name: Saylane
options:
  bundleIdPrefix: com.rtranslate
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.53"
    CURRENT_PROJECT_VERSION: "53"
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  MLXASR:
    path: Vendor/MLXASR

targets:
  Saylane:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Resources/AppIcon.iconset/**
          - Resources/AppIcon.png
      - path: Vendor/Rime/Rime
        name: Rime
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: InputMethodKit.framework
      - framework: Vendor/Rime/Runtime/lib/librime.1.dylib
        embed: true
        codeSign: true
      - package: MLXASR
        product: MLXASR
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/IME/Rime/SaylaneRime.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/Rime/Runtime/lib"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/Rime/Runtime/include"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.rtranslate.inputmethod.rtranslate
        PRODUCT_NAME: Saylane
        CODE_SIGN_ENTITLEMENTS: Sources/Saylane.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Saylane:
    build:
      targets:
        Saylane: all
