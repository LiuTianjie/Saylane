<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Screen translation fixture</title>
<!--
  One page, two languages: app.html?lang=en and app.html?lang=zh render the
  same layout with the same styles, the way a localized application does.
  Add &theme=dark for the dark variant. Every text node carries data-k so the
  two renderings can be joined element by element.
-->
<style>
  :root { --bg: #ffffff; --panel: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0071e3; --bubble: #e9e9eb; --mine: #34c759; }
  .dark { --bg: #1c1c1e; --panel: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --line: #3a3a3c; --accent: #0a84ff; --bubble: #3a3a3c; --mine: #30d158; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; width: 1200px; }
  .window { display: grid; grid-template-columns: 210px 1fr 330px; grid-template-rows: 52px auto; border-bottom: 1px solid var(--line); }
  .toolbar { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .toolbar .title { font-size: 15px; font-weight: 600; margin-right: auto; }
  .btn { font-size: 13px; padding: 5px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .search { width: 220px; font-size: 13px; color: var(--muted); padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; }
  .sidebar .group { font-size: 11px; font-weight: 600; color: var(--muted); padding: 10px 10px 4px; text-transform: uppercase; letter-spacing: .04em; }
  .nav { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 6px; }
  .nav.sel { background: var(--accent); color: #fff; font-weight: 500; }
  .nav i { width: 16px; height: 16px; border-radius: 4px; background: currentColor; opacity: .55; flex: none; }
  .nav .count { margin-left: auto; font-size: 11px; color: var(--muted); }
  .nav.sel .count { color: #fff; }
  .chat { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .stamp { align-self: center; font-size: 11px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #ff9f0a, #ff375f); flex: none; }
  .row.me .avatar { background: linear-gradient(135deg, #64d2ff, #5e5ce6); }
  .who { font-size: 12px; color: var(--muted); margin: 0 0 2px 4px; }
  .bubble { max-width: 440px; font-size: 15px; line-height: 1.4; padding: 8px 12px; border-radius: 16px; background: var(--bubble); }
  .row.me .bubble { background: var(--mine); color: #fff; }
  .composer { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .composer .field { flex: 1; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 18px; border: 1px solid var(--line); }
  .inspector { border-left: 1px solid var(--line); padding: 14px 16px; }
  .inspector h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .setting { display: flex; align-items: center; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .setting .value { margin-left: auto; color: var(--muted); }
  .toggle { margin-left: auto; width: 34px; height: 20px; border-radius: 10px; background: var(--mine); }
  .hint { font-size: 11px; color: var(--muted); margin: 6px 0 14px; }
  .link { color: var(--accent); }
  .content { display: grid; grid-template-columns: 1fr 420px; gap: 28px; padding: 22px 24px; }
  article h1 { font-size: 30px; line-height: 1.15; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
  article .meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  article h2 { font-size: 20px; font-weight: 600; margin: 20px 0 6px; }
  article p { font-size: 16px; line-height: 1.6; margin: 0 0 12px; }
  article .serif { font-family: Georgia, "Songti SC", serif; font-size: 17px; }
  article ul { margin: 0 0 12px; padding-left: 22px; font-size: 16px; line-height: 1.6; }
  article blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); font-size: 15px; }
  pre { font: 13px/1.5 Menlo, monospace; background: var(--panel); padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
  .card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .cover { height: 92px; display: flex; align-items: flex-end; padding: 8px 10px; color: #fff; font-size: 14px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .c1 { background: linear-gradient(120deg, #0a84ff, #bf5af2 60%, #ff375f); }
  .c2 { background: radial-gradient(circle at 20% 20%, #ffd60a, #ff9f0a 45%, #1c1c1e); }
  .card .body { padding: 9px 11px 11px; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .desc { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9px; margin: 7px 4px 0 0; }
  .chip.g { background: #e3f6e8; color: #1e7b34; }
  .chip.b { background: #e1efff; color: #0058b8; }
  table { grid-column: 1 / 3; width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .video { position: relative; height: 190px; background:
      radial-gradient(circle at 70% 30%, rgba(255,214,10,.9), transparent 35%),
      linear-gradient(160deg, #0b3d2e, #14532d 40%, #7c2d12 75%, #1c1917); }
  .video .sub { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 22px; font-weight: 600; color: #fff;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,.6); }
  .video .tag { position: absolute; top: 10px; left: 12px; font-size: 12px; color: #fff; background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="window">
  <div class="toolbar">
    <span class="title" data-k="app"></span>
    <span class="search" data-k="search"></span>
    <span class="btn" data-k="share"></span>
    <span class="btn primary" data-k="newmsg"></span>
  </div>
  <div class="sidebar">
    <div class="group" data-k="g1"></div>
    <div class="nav sel"><i></i><span data-k="inbox"></span><span class="count">12</span></div>
    <div class="nav"><i></i><span data-k="drafts"></span><span class="count">3</span></div>
    <div class="nav"><i></i><span data-k="sent"></span></div>
    <div class="nav"><i></i><span data-k="archive"></span></div>
    <div class="group" data-k="g2"></div>
    <div class="nav"><i></i><span data-k="design"></span></div>
    <div class="nav"><i></i><span data-k="eng"></span></div>
    <div class="nav"><i></i><span data-k="settings"></span></div>
  </div>
  <div class="chat">
    <div class="stamp" data-k="stamp"></div>
    <div><div class="who" data-k="who1"></div>
      <div class="row"><div class="avatar"></div><div class="bubble" data-k="m1"></div></div></div>
    <div class="row me"><div class="avatar"></div><div class="bubble" data-k="m2"></div></div>
    <div><div class="who" data-k="who1"></div>
      <div class="row"><div class="avatar"></div><div class="bubble" data-k="m3"></div></div></div>
    <div class="row me"><div class="avatar"></div><div class="bubble" data-k="m4"></div></div>
    <div class="composer"><div class="field" data-k="compose"></div><span class="btn primary" data-k="send"></span></div>
  </div>
  <div class="inspector">
    <h3 data-k="s0"></h3>
    <div class="setting"><span data-k="s1"></span><span class="toggle"></span></div>
    <div class="setting"><span data-k="s2"></span><span class="value" data-k="s2v"></span></div>
    <div class="setting"><span data-k="s3"></span><span class="value" data-k="s3v"></span></div>
    <div class="hint" data-k="hint"></div>
    <div class="video"><span class="tag" data-k="live"></span><div class="sub" data-k="sub"></div></div>
  </div>
</div>
<div class="content">
  <article>
    <h1 data-k="h1"></h1>
    <div class="meta" data-k="meta"></div>
    <p data-k="p1"></p>
    <h2 data-k="h2"></h2>
    <p class="serif" data-k="p2"></p>
    <ul><li data-k="l1"></li><li data-k="l2"></li><li data-k="l3"></li></ul>
    <blockquote data-k="q"></blockquote>
    <pre>let session = TranslationSession(source: .en, target: .zhHans)
let result = try await session.translate(text)</pre>
  </article>
  <div class="cards">
    <div class="card"><div class="cover c1" data-k="c1cover"></div><div class="body">
      <div class="name" data-k="c1name"></div><div class="desc" data-k="c1desc"></div>
      <span class="chip g" data-k="chipnew"></span><span class="chip b" data-k="chipfree"></span></div></div>
    <div class="card"><div class="cover c2" data-k="c2cover"></div><div class="body">
      <div class="name" data-k="c2name"></div><div class="desc" data-k="c2desc"></div>
      <span class="chip b" data-k="chippro"></span></div></div>
    <table>
      <tr><th data-k="t0"></th><th data-k="t1"></th><th class="n" data-k="t2"></th><th class="n" data-k="t3"></th></tr>
      <tr><td data-k="r1a"></td><td data-k="r1b"></td><td class="n">1,284</td><td class="n">98.2%</td></tr>
      <tr><td data-k="r2a"></td><td data-k="r2b"></td><td class="n">376</td><td class="n">91.5%</td></tr>
      <tr><td data-k="r3a"></td><td data-k="r3b"></td><td class="n">52</td><td class="n">76.0%</td></tr>
    </table>
  </div>
</div>
<script>
const S = {
  app: ["Messages", "信息"], search: ["Search conversations", "搜索对话"], share: ["Share", "共享"], newmsg: ["New Message", "新信息"],
  g1: ["Mailboxes", "邮箱"], inbox: ["Inbox", "收件箱"], drafts: ["Drafts", "草稿"], sent: ["Sent", "已发送"], archive: ["Archive", "归档"],
  g2: ["Teams", "团队"], design: ["Design Review", "设计评审"], eng: ["Engineering", "工程"], settings: ["Settings", "设置"],
  stamp: ["Today 9:41 AM", "今天 上午 9:41"], who1: ["Lin Wei", "林薇"],
  m1: ["Did you get a chance to look at the new onboarding flow?", "你有空看一下新的引导流程了吗？"],
  m2: ["Yes. The first screen is much clearer now, but the permission step still feels long.", "看了。第一屏现在清楚多了，但权限那一步还是显得有点长。"],
  m3: ["Agreed. Let's cut it to one page and ask for the microphone only when it is first used.", "同意。我们把它压成一页，麦克风等第一次用到时再申请。"],
  m4: ["Sounds good, I'll send a build tonight.", "好，我今晚发一个版本。"],
  compose: ["Write a message", "写信息"], send: ["Send", "发送"],
  s0: ["Notifications", "通知"], s1: ["Show previews", "显示预览"], s2: ["Sound", "提示音"], s2v: ["Chime", "风铃"],
  s3: ["Mute until", "静音至"], s3v: ["Tomorrow morning", "明天早上"],
  hint: ["Changes apply to this conversation only. ", "更改仅对此对话生效。"],
  live: ["Live", "直播"], sub: ["I never thought we would make it this far.", "我从没想过我们能走到这一步。"],
  h1: ["Translate what is on your screen, in place", "原位翻译屏幕上的内容"],
  meta: ["Updated October 2, 2026 · 4 min read", "更新于 2026 年 10 月 2 日 · 阅读约 4 分钟"],
  p1: ["Select any region and the text inside it is replaced by its translation. The layout, the pictures and the colours stay exactly where they were, so the page still reads like the original application.",
       "框选任意区域，其中的文字就会被替换成译文。版面、图片和颜色都保持在原来的位置，页面读起来仍然像原来的应用。"],
  h2: ["How it works", "工作原理"],
  p2: ["Recurrent neural networks have long been established as the standard approach to sequence modelling. Attention mechanisms removed the need to process the sequence in order.",
       "循环神经网络长期以来是序列建模的标准方法。注意力机制消除了按顺序处理序列的需要。"],
  l1: ["Text is measured from the pixels, not guessed from the box.", "文字从像素中测量，而不是根据外框猜测。"],
  l2: ["Only the strokes are erased; the background is restored.", "只擦除笔画，背景被还原。"],
  l3: ["The translation keeps the size, weight and colour.", "译文保持字号、字重和颜色。"],
  q: ["“It should look as if the system language had been switched.”", "“看起来应该像切换了系统语言一样。”"],
  c1cover: ["Weekly highlights", "本周精选"], c1name: ["Live region", "实时区域"],
  c1desc: ["Keeps translating whatever appears inside the frame.", "持续翻译框内出现的任何内容。"],
  chipnew: ["New", "新"], chipfree: ["Free", "免费"],
  c2cover: ["Night mode", "夜间模式"], c2name: ["Pinned capture", "钉住的截图"],
  c2desc: ["A frozen copy you can compare with the original.", "一份可与原图对照的定格副本。"], chippro: ["Pro", "专业版"],
  t0: ["Document", "文档"], t1: ["Owner", "所有者"], t2: ["Words", "字数"], t3: ["Accuracy", "准确率"],
  r1a: ["Quarterly report", "季度报告"], r1b: ["Finance team", "财务团队"],
  r2a: ["Release notes", "发布说明"], r2b: ["Engineering", "工程"],
  r3a: ["Welcome email", "欢迎邮件"], r3b: ["Marketing", "市场"],
};
const q = new URLSearchParams(location.search);
const index = q.get("lang") === "zh" ? 1 : 0;
document.documentElement.lang = index ? "zh-Hans" : "en";
if (q.get("theme") === "dark") document.body.classList.add("dark");
for (const el of document.querySelectorAll("[data-k]")) el.textContent = S[el.dataset.k][index].trim();
</script>
</body>
</html>
