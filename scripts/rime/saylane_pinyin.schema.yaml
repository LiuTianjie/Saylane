schema:
  schema_id: saylane_pinyin
  name: Saylane 拼音
  version: '1.0'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - table_translator@english
  filters:
    - uniquifier
menu:
  page_size: 9
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: saylane
  prism: saylane_pinyin
  user_dict: saylane
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 0
  preedit_format:
    - xform/ /'/

english:
  dictionary: melt_eng
  prism: saylane_en
  user_dict: saylane_en
  enable_user_dict: true
  enable_sentence: false
  enable_completion: false
  initial_quality: 24
  comment_format:
    - xform/.*//
