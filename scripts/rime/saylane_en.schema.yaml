schema:
  schema_id: saylane_en
  name: Saylane English
  version: "1.0"
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    - derive/^.+$/\L$0/
translator:
  dictionary: melt_eng
  prism: saylane_en
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
